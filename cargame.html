<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Racing Game</title>
    <link rel="stylesheet" href="cargame.css">
</head>
<body>

    <h1 class="title">🏎️ Car Racing Game</h1>

    <div class="scoreBox">
        Score: <span id="score">0</span>
    </div>

    <div id="gameArea">
        <img id="car" src="https://t4.ftcdn.net/jpg/01/97/79/23/240_F_197792302_EoR73aFr57Jb6aSNcR3Jv3vtor8w3V08.webp">
    </div>

    <div class="buttons">
        <button id="startBtn">Start Game</button>
        <button id="restartBtn">Restart</button>
    </div>

    <div class="touchControls">
        <button id="leftBtn">⬅️</button>
        <button id="rightBtn">➡️</button>
    </div>

    <p class="instruction">
        Use ⬅️ ➡️ keys or touch buttons to move the car.
    </p>

    <script src="cargame.js"></script>
</body>
</html>
